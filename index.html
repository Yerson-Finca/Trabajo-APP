<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#007AFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>YERSON PÉREZ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <style>
        :root {
            --primary: #007AFF;
            --success: #34C759;
            --danger: #FF3B30;
            --warning: #FF9500;
            --bg: #F2F2F7;
            --surface: #FFFFFF;
            --text-main: #000000;
            --text-sec: #8E8E93;
            --radius-l: 20px;
            --radius-m: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 100px; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; min-height: 100vh; }
        
        header { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            padding: 16px 20px; position: sticky; top: 0; z-index: 90; border-bottom: 0.5px solid rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center; 
        }
        h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
        .date-badge { font-size: 12px; color: var(--text-sec); font-weight: 600; background: #E5E5EA; padding: 4px 10px; border-radius: 12px; }
        
        .content { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stats & Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: var(--surface); padding: 14px; border-radius: var(--radius-l); box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .stat-icon svg { width: 20px; height: 20px; stroke: white; stroke-width: 2.5; fill: none; }
        .stat-info { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: var(--text-sec); font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: 700; }
        
        /* Calendario Cuadrado Redondeado */
        .calendar-wrapper { background: var(--surface); border-radius: var(--radius-l); padding: 16px; box-shadow: var(--shadow); margin-bottom: 25px; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .day-name { font-size: 11px; color: var(--text-sec); font-weight: 600; margin-bottom: 8px; }
        .day { 
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center; 
            font-size: 14px; border-radius: 8px; cursor: pointer; position: relative; font-weight: 500;
            transition: all 0.2s;
        }
        .day.has-work-paid { background: var(--success); color: white; }
        .day.has-work-pending { background: var(--danger); color: white; }
        .day.has-work-future { background: var(--primary); color: white; }
        .day.selected-day { border: 2px solid var(--text-main); transform: scale(0.95); }
        .day.past-empty { color: #d1d1d6; }

        /* Tarjetas Compactas Agrupadas */
        .section-title { font-size: 13px; font-weight: 700; color: var(--text-sec); text-transform: uppercase; margin-bottom: 10px; }
        .card { 
            background: var(--surface); padding: 14px; border-radius: var(--radius-m); 
            margin-bottom: 10px; box-shadow: var(--shadow); border-left: 4px solid var(--primary);
        }
        .card-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .card-title { font-weight: 600; font-size: 15px; }
        .card-amount { font-weight: 700; font-size: 15px; }
        
        .dates-compact { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .date-mini { font-size: 11px; background: #F2F2F7; padding: 2px 6px; border-radius: 4px; color: var(--text-sec); }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        
        /* Filtros */
        .filter-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .filter-btn { 
            padding: 6px 14px; border-radius: 16px; border: 1px solid #E5E5EA; 
            background: white; color: var(--text-sec); font-size: 12px; font-weight: 600; cursor: pointer; 
        }
        .filter-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); }

        /* Inputs & Buttons */
        .input-field { width: 100%; padding: 14px; border: 1px solid #E5E5EA; border-radius: 12px; font-size: 16px; background: white; margin-bottom: 12px; }
        .search-bar { width: 100%; padding: 10px 16px; border: none; border-radius: 12px; font-size: 15px; background: #E5E5EA; margin-bottom: 15px; }
        .btn { padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: #FFEAEA; color: var(--danger); }
        
        /* Menú Invertido */
        .bottom-nav { 
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; height: 65px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 35px; display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); z-index: 1000; border: 0.5px solid rgba(0,0,0,0.05);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sec); font-size: 10px; font-weight: 500; cursor: pointer; width: 50px; }
        .nav-item.active { color: var(--primary); }
        .nav-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; margin-bottom: 4px; }
        
        .fab-container { position: relative; top: -25px; }
        .fab-btn { 
            width: 60px; height: 60px; background: var(--primary); border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; color: white; 
            box-shadow: 0 8px 20px rgba(0,122,255,0.4); cursor: pointer; border: 4px solid var(--bg);
        }
        .fab-menu { position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 10px; width: 200px; z-index: 999; }
        .fab-option { background: white; padding: 14px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-weight: 600; font-size: 14px; cursor: pointer; text-align: center; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 2000; backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface); margin: 15% auto; padding: 28px; border-radius: 24px; width: 90%; max-width: 450px; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
        .close-btn { width: 32px; height: 32px; border-radius: 50%; background: #E5E5EA; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .chart-box { background: white; padding: 20px; border-radius: var(--radius-l); margin-bottom: 20px; box-shadow: var(--shadow); }
        .day-details-modal { margin-top: 15px; padding: 15px; background: #F2F2F7; border-radius: 12px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>YERSON PÉREZ</h1>
            <div class="date-badge" id="currentDateDisplay"></div>
        </header>

        <!-- INICIO -->
        <div id="home" class="content active">
            <div class="section-title">📅 Calendario de Actividades</div>
            <div class="calendar-wrapper">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <h2 id="monthYear"></h2>
                    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calGrid"></div>
                <div id="dayDetails" class="day-details-modal"></div>
            </div>
            
            <div class="section-title">Resumen Mensual</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--success)"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                    <div class="stat-info"><div class="stat-label">Ganancia</div><div class="stat-value" style="color:var(--success)" id="earnings">$0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--danger)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                    <div class="stat-info"><div class="stat-label">Pendiente</div><div class="stat-value" style="color:var(--danger)" id="pending">$0</div></div>
                </div>
            </div>
        </div>

        <!-- TRABAJOS -->
        <div id="works" class="content">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar lugar..." onkeyup="applyFilters()">
            <div class="filter-container">
                <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
                <button class="filter-btn" onclick="setFilter('pending', this)">Por Cobrar</button>
                <button class="filter-btn" onclick="setFilter('week', this)">Esta Semana</button>
            </div>
            <div class="section-title">Trabajos Agrupados</div>
            <div id="allWorksList"></div>
        </div>

        <!-- FINANZAS (Antes Gastos) -->
        <div id="finances" class="content">
            <div class="section-title">Balance General</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--warning)"><svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div>
                    <div class="stat-info"><div class="stat-label">Gastos Totales</div><div class="stat-value" style="color:var(--warning)" id="totalExpensesAll">$0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background:var(--primary)"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
                    <div class="stat-info"><div class="stat-label">Neto Real</div><div class="stat-value" id="netProfit">$0</div></div>
                </div>
            </div>
            
            <div class="chart-box"><h3 style="font-size:15px; text-align:center; margin-bottom:10px;">Flujo de Caja</h3><canvas id="financeChart"></canvas></div>
            
            <div class="section-title">Historial de Gastos</div>
            <div id="expensesList"></div>
        </div>

        <!-- CONFIGURACIÓN -->
        <div id="settings" class="content">
            <div class="section-title">Administración</div>
            <div style="background:white; padding:20px; border-radius:20px; text-align:center;">
                <button class="btn btn-primary" onclick="exportBackup()" style="width:100%; margin-bottom:12px; padding:14px;">Descargar Respaldo</button>
                <label class="btn" style="width:100%; display:block; background:#F2F2F7; padding:14px;">
                    Restaurar Datos
                    <input type="file" id="restoreFile" onchange="importBackup(this)" style="display:none;" accept=".json">
                </label>
            </div>
        </div>
    </div>

    <!-- MENÚ FLOTANTE (INVERTIDO) -->
    <div class="bottom-nav">
        <!-- Lado Derecho: Ajustes y Finanzas -->
        <div class="nav-item" onclick="showTab('settings', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
            <span>Ajustes</span>
        </div>
        <div class="nav-item" onclick="showTab('finances', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
            <span>Finanzas</span>
        </div>
        
        <div class="fab-container">
            <div class="fab-btn" onclick="toggleFabMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="fab-menu" id="fabMenu">
                <div class="fab-option" onclick="openModal('work'); toggleFabMenu()">Nuevo Trabajo</div>
                <div class="fab-option" onclick="openModal('expense'); toggleFabMenu()">Registrar Gasto</div>
            </div>
        </div>

        <!-- Lado Izquierdo: Trabajos e Inicio -->
        <div class="nav-item" onclick="showTab('works', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
            <span>Trabajos</span>
        </div>
        <div class="nav-item active" onclick="showTab('home', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Inicio</span>
        </div>
    </div>

    <!-- MODALES (Simplificados) -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Trabajo</h2><button class="close-btn" onclick="closeModal('workModal')">&times;</button></div>
            <form onsubmit="saveWork(event)">
                <input type="hidden" id="wId">
                <input type="text" id="wLocation" class="input-field" placeholder="Lugar / Finca" required>
                <input type="number" id="wAmount" class="input-field" placeholder="Monto Total ($)" step="100" required>
                <div style="display:flex; gap:8px; margin-bottom:12px;">
                    <input type="date" id="wNewDate" class="input-field" style="flex:1; margin:0;">
                    <button type="button" class="btn btn-primary" onclick="addDateToTempList()" style="width:auto;">+</button>
                </div>
                <div id="tempDatesList" class="dates-compact" style="margin-bottom:16px;"></div>
                <div style="background:#F2F2F7; padding:14px; border-radius:12px; display:flex; align-items:center; gap:12px; margin-bottom:20px;">
                    <input type="checkbox" id="wPaid" style="width:20px; height:20px;">
                    <label>¿Pagado?</label>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:14px;">Guardar</button>
            </form>
        </div>
    </div>

    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Gasto</h2><button class="close-btn" onclick="closeModal('expenseModal')">&times;</button></div>
            <form onsubmit="saveExpense(event)">
                <input type="date" id="eDate" class="input-field" required>
                <input type="text" id="eDesc" class="input-field" placeholder="Descripción" required>
                <input type="number" id="eAmount" class="input-field" placeholder="Monto ($)" step="100" required>
                <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; background:var(--warning);">Guardar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
        }

        const DB = {
            get(key) { return JSON.parse(localStorage.getItem(key) || '[]'); },
            set(key, data) { localStorage.setItem(key, JSON.stringify(data)); },
            add(key, item) { item.id = Date.now(); const data = DB.get(key); data.push(item); DB.set(key, data); },
            update(key, id, newData) { const data = DB.get(key).map(i => i.id == id ? {...i, ...newData} : i); DB.set(key, data); },
            remove(key, id) { const data = DB.get(key).filter(i => i.id !== id); DB.set(key, data); }
        };

        let currentMonth = new Date();
        let chart1, financeChart;
        let tempDates = [];
        let selectedDayInfo = null;
        let currentFilter = 'all';
        const today = new Date().toISOString().split('T')[0];

        const formatMoney = (amount) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(amount);
        const formatDate = (dateStr) => new Date(dateStr + 'T00:00:00').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('wNewDate').min = today;
            document.getElementById('eDate').valueAsDate = new Date();
            document.getElementById('wNewDate').valueAsDate = new Date();
            document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
            renderCalendar();
            updateHome();
            updateAllWorks();
            updateFinances();
        });

        function showTab(name, element) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            if(element) element.classList.add('active');
            if (name === 'home') { renderCalendar(); updateHome(); }
            if (name === 'works') updateAllWorks();
            if (name === 'finances') updateFinances();
        }

        function toggleFabMenu() {
            const menu = document.getElementById('fabMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // CALENDARIO INTELIGENTE
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            document.getElementById('monthYear').textContent = months[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Mapear trabajos por día
            const dayMap = {};
            DB.get('works').forEach(w => {
                w.dates.forEach(d => {
                    if (!dayMap[d]) dayMap[d] = [];
                    dayMap[d].push(w);
                });
            });

            let html = '';
            ['D','L','M','M','J','V','S'].forEach(d => html += `<div class="day-name">${d}</div>`);
            for (let i = 0; i < firstDay; i++) html += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const works = dayMap[dateStr];
                let classes = 'day';
                
                if (works) {
                    // Lógica de color: Si hay alguno pendiente, todo el día rojo. Si todos pagados, verde.
                    const hasPending = works.some(w => !w.paid);
                    const isFuture = new Date(dateStr) > new Date(today);
                    
                    if (isFuture) classes += ' has-work-future';
                    else if (hasPending) classes += ' has-work-pending';
                    else classes += ' has-work-paid';
                    
                    html += `<div class="${classes}" onclick="showDayDetails('${dateStr}')">${day}</div>`;
                } else {
                    if (dateStr < today) classes += ' past-empty';
                    html += `<div class="${classes}">${day}</div>`;
                }
            }
            document.getElementById('calGrid').innerHTML = html;
        }

        function showDayDetails(dateStr) {
            const detailsDiv = document.getElementById('dayDetails');
            const works = DB.get('works').filter(w => w.dates.includes(dateStr));
            
            if (works.length > 0) {
                let html = `<strong>${formatDate(dateStr)}</strong><br>`;
                works.forEach(w => {
                    const status = w.paid ? '<span style="color:var(--success)">✓ Pagado</span>' : '<span style="color:var(--danger)">⏳ Pendiente</span>';
                    html += `<div style="margin-top:5px; font-size:13px;">${w.location} - ${status}</div>`;
                });
                detailsDiv.innerHTML = html;
                detailsDiv.style.display = 'block';
            } else {
                detailsDiv.style.display = 'none';
            }
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            document.getElementById('dayDetails').style.display = 'none';
            renderCalendar();
        }

        // FILTROS Y LISTAS AGRUPADAS
        function setFilter(filterType, btnElement) {
            currentFilter = filterType;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            let works = DB.get('works');
            const now = new Date();
            const nextWeek = new Date(); nextWeek.setDate(now.getDate() + 7);

            if (currentFilter === 'pending') works = works.filter(w => !w.paid);
            else if (currentFilter === 'week') {
                works = works.filter(w => w.dates.some(d => {
                    const dateObj = new Date(d);
                    return dateObj >= now && dateObj <= nextWeek;
                }));
            }

            if (term) works = works.filter(w => w.location.toLowerCase().includes(term));
            works.sort((a,b) => new Date(b.dates[b.dates.length-1]) - new Date(a.dates[a.dates.length-1]));

            const container = document.getElementById('allWorksList');
            if (works.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:var(--text-sec);padding:20px;">Sin resultados</div>';
            } else {
                container.innerHTML = works.map(w => {
                    const datesHtml = w.dates.sort().map(d => `<span class="date-mini">${formatDate(d)}</span>`).join('');
                    const statusColor = w.paid ? 'var(--success)' : 'var(--danger)';
                    return `
                    <div class="card" style="border-left-color:${statusColor}">
                        <div class="card-row">
                            <div class="card-title">${w.location}</div>
                            <div class="card-amount">${formatMoney(w.amount)}</div>
                        </div>
                        <div class="dates-compact">${datesHtml}</div>
                        <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
                            <span style="font-size:11px; font-weight:600; color:${statusColor}">${w.paid ? 'PAGADO' : 'PENDIENTE'}</span>
                            <div style="display:flex; gap:8px;">
                                <button class="btn" style="background:#F2F2F7; padding:6px 10px;" onclick="editWork(${w.id})">Editar</button>
                                <button class="btn btn-danger" style="padding:6px 10px;" onclick="deleteItem('works', ${w.id})">Borrar</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        function updateHome() {
            const now = new Date();
            const works = DB.get('works');
            let earnings = 0, pending = 0;
            
            works.forEach(w => {
                const datesInMonth = w.dates.filter(d => new Date(d).getMonth() === now.getMonth());
                if (datesInMonth.length > 0) {
                    const amountPerDay = parseFloat(w.amount) / w.dates.length;
                    const monthVal = amountPerDay * datesInMonth.length;
                    earnings += monthVal;
                    if (!w.paid) pending += monthVal;
                }
            });
            document.getElementById('earnings').textContent = formatMoney(earnings);
            document.getElementById('pending').textContent = formatMoney(pending);
        }

        function updateFinances() {
            const expenses = DB.get('expenses');
            const totalExp = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
            const totalInc = DB.get('works').reduce((s, w) => s + parseFloat(w.amount), 0); // Simplificado
            
            document.getElementById('totalExpensesAll').textContent = formatMoney(totalExp);
            document.getElementById('netProfit').textContent = formatMoney(totalInc - totalExp);
            
            document.getElementById('expensesList').innerHTML = expenses.slice().reverse().map(e => `
                <div class="card" style="border-left-color:var(--warning)">
                    <div class="card-row"><div class="card-title">${e.description}</div><div class="card-amount">-${formatMoney(e.amount)}</div></div>
                    <div style="font-size:12px; color:var(--text-sec);">${formatDate(e.date)}</div>
                </div>
            `).join('');

            if(financeChart) financeChart.destroy();
            financeChart = new Chart(document.getElementById('financeChart'), { 
                type: 'line', 
                data: { 
                    labels: ['Ingresos', 'Gastos'], 
                    datasets: [{ label: 'Balance', data: [totalInc, totalExp], borderColor: '#007AFF', backgroundColor: 'rgba(0,122,255,0.1)', fill: true }] 
                } 
            });
        }

        // GESTIÓN DE DATOS
        function addDateToTempList() {
            const date = document.getElementById('wNewDate').value;
            if (date && !tempDates.includes(date)) { 
                tempDates.push(date); 
                tempDates.sort();
                renderTempDates(); 
            } else if (tempDates.includes(date)) {
                alert('Esta fecha ya está agregada a este trabajo.');
            }
        }

        function renderTempDates() {
            document.getElementById('tempDatesList').innerHTML = tempDates.map(d => `<span class="date-mini" style="cursor:pointer; background:#FFEAEA; color:red;" onclick="removeTempDate('${d}')">${formatDate(d)} ×</span>`).join('');
        }

        function removeTempDate(date) { tempDates = tempDates.filter(d => d !== date); renderTempDates(); }

        function openModal(type) {
            tempDates = [];
            document.getElementById('tempDatesList').innerHTML = '';
            if (type === 'work') {
                document.getElementById('wId').value = '';
                document.getElementById('wLocation').value = '';
                document.getElementById('wAmount').value = '';
                document.getElementById('wPaid').checked = false;
            }
            document.getElementById(type + 'Modal').style.display = 'block';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function editWork(id) {
            const work = DB.get('works').find(w => w.id == id);
            if (!work) return;
            document.getElementById('wId').value = work.id;
            document.getElementById('wLocation').value = work.location;
            document.getElementById('wAmount').value = work.amount;
            document.getElementById('wPaid').checked = work.paid;
            tempDates = [...work.dates];
            renderTempDates();
            document.getElementById('workModal').style.display = 'block';
        }

        function saveWork(e) {
            e.preventDefault();
            if (tempDates.length === 0) { alert('Agrega al menos una fecha'); return; }
            const id = document.getElementById('wId').value;
            const data = { location: document.getElementById('wLocation').value, amount: document.getElementById('wAmount').value, paid: document.getElementById('wPaid').checked, dates: tempDates };
            id ? DB.update('works', id, data) : DB.add('works', data);
            closeModal('workModal');
            refreshAll();
        }

        function saveExpense(e) {
            e.preventDefault();
            DB.add('expenses', { date: document.getElementById('eDate').value, description: document.getElementById('eDesc').value, amount: document.getElementById('eAmount').value });
            closeModal('expenseModal');
            refreshAll();
        }

        function deleteItem(type, id) { if (confirm('¿Eliminar?')) { DB.remove(type, id); refreshAll(); } }
        function refreshAll() { renderCalendar(); updateHome(); updateAllWorks(); updateFinances(); }
        function updateAllWorks() { applyFilters(); }

        function exportBackup() {
            const data = { works: DB.get('works'), expenses: DB.get('expenses') };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `respaldo_${today}.json`; a.click();
        }

        function importBackup(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if(confirm('¿Reemplazar datos?')) {
                        DB.set('works', data.works); DB.set('expenses', data.expenses);
                        refreshAll(); alert('Datos restaurados');
                    }
                } catch (err) { alert('Error'); }
            };
            reader.readAsText(file);
        }
        
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
            if (!e.target.closest('.fab-container')) document.getElementById('fabMenu').style.display = 'none';
        }
    </script>
</body>
</html>
