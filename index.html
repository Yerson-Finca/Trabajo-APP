<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Tracker Pro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); padding-bottom: 110px; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; min-height: 100vh; position: relative; }
        
        header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); padding: 20px 24px; position: sticky; top: 0; z-index: 90; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        
        .content { display: none; padding: 24px; animation: fadeIn 0.3s ease; }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--surface); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border); text-align: center; }
        .stat-label { font-size: 12px; color: var(--text-sec); font-weight: 600; margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 800; }
        .stat-value.success { color: var(--success); }
        .stat-value.danger { color: var(--danger); }
        .stat-value.warning { color: var(--warning); }
        
        /* Calendario */
        .calendar-wrapper { background: var(--surface); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-name { text-align: center; font-size: 11px; color: var(--text-sec); font-weight: 600; margin-bottom: 8px; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; position: relative; background: var(--bg); transition: all 0.2s; }
        .day.has-work { background: var(--primary); color: white; }
        .day.selected-range { background: #e0e7ff; color: var(--primary); border: 2px dashed var(--primary); }
        .dot { position: absolute; bottom: 6px; width: 4px; height: 4px; background: currentColor; border-radius: 50%; }
        
        /* Lista Próximos (Home) */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
        .upcoming-card { background: var(--surface); padding: 15px; border-radius: var(--radius-lg); margin-bottom: 12px; border-left: 5px solid var(--primary); box-shadow: var(--shadow-sm); display: flex; justify-content: space-between; align-items: center; }
        .upcoming-date { font-size: 12px; font-weight: 700; color: var(--primary); background: #eff6ff; padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; display: inline-block; }
        .upcoming-place { font-weight: 600; font-size: 15px; }
        
        /* Buscador y Lista General */
        .search-bar { width: 100%; padding: 14px 20px; border: 2px solid var(--border); border-radius: var(--radius-lg); font-size: 16px; background: var(--surface); margin-bottom: 20px; }
        .work-card { background: var(--surface); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); position: relative; overflow: hidden; }
        .work-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--primary); }
        .work-card.paid::before { background: var(--success); }
        .work-card.pending::before { background: var(--danger); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-weight: 700; font-size: 16px; }
        .card-amount { font-weight: 800; color: var(--success); background: #ecfdf5; padding: 4px 10px; border-radius: 8px; }
        
        .dates-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
        .date-chip { background: var(--bg); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
        .date-chip button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; }
        
        .status-badge { display: inline-flex; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
        .status-badge.paid { background: #ecfdf5; color: var(--success); }
        .status-badge.pending { background: #fff1f2; color: var(--danger); }
        
        .card-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn-action { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary-soft { background: #eff6ff; color: var(--primary); }
        .btn-danger-soft { background: #fff1f2; color: var(--danger); }
        
        /* Backup */
        .backup-section { margin-top: 30px; padding: 20px; background: #f0f9ff; border-radius: var(--radius-lg); border: 1px dashed #bae6fd; text-align: center; }
        .backup-btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; margin: 5px; font-size: 14px; }
        .btn-backup-save { background: var(--primary); color: white; }
        .btn-backup-load { background: white; border: 1px solid var(--border); color: var(--text-main); }
        
        /* Menú Flotante */
        .bottom-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 72px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border-radius: 36px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; padding: 0 12px; border: 1px solid rgba(255,255,255,0.6); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sec); font-size: 10px; font-weight: 600; cursor: pointer; width: 56px; transition: all 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; margin-bottom: 4px; }
        
        .fab-container { position: relative; top: -28px; }
        .fab-btn { width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); cursor: pointer; border: 4px solid var(--bg); }
        .fab-btn svg { width: 28px; height: 28px; stroke: white; stroke-width: 2.5; fill: none; }
        
        .fab-menu { position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; gap: 10px; width: 200px; z-index: 999; }
        .fab-option { background: white; padding: 14px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; animation: popIn 0.3s ease; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 2000; backdrop-filter: blur(8px); }
        .modal-content { background: var(--surface); margin: 10% auto; padding: 32px; border-radius: 32px; width: 90%; max-width: 480px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .close-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); border: none; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
        input, textarea { width: 100%; padding: 16px; border: 2px solid var(--border); border-radius: 16px; font-size: 16px; background: var(--bg); transition: all 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); background: white; }
        
        .btn-submit { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
        .multi-date-controls { display: flex; gap: 10px; margin-top: 10px; }
        .btn-confirm-dates { flex: 1; padding: 12px; background: var(--success); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Work Tracker</h1>
            <div style="font-size: 12px; color: var(--text-sec); font-weight: 600;" id="currentDateDisplay"></div>
        </header>

        <!-- INICIO -->
        <div id="home" class="content active">
            <div class="calendar-wrapper">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <h2 id="monthYear"></h2>
                    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div style="text-align:center; font-size:12px; color:var(--text-sec); margin-bottom:10px;">Toca días para selección múltiple</div>
                <div class="calendar-grid" id="calGrid"></div>
                <button id="confirmRangeBtn" class="btn-confirm-dates" onclick="confirmSelectedDates()">✅ Agregar Días Seleccionados</button>
            </div>
            
            <!-- NUEVA SECCIÓN: PRÓXIMOS TRABAJOS -->
            <div class="section-header">
                <div class="section-title">📅 Esta Semana</div>
            </div>
            <div id="upcomingList"></div>
            
            <hr style="border:0; border-top:1px solid var(--border); margin: 30px 0;">
            
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Ganancia Mes</div><div class="stat-value success" id="earnings">$0</div></div>
                <div class="stat-card"><div class="stat-label">Pendiente</div><div class="stat-value danger" id="pending">$0</div></div>
                <div class="stat-card"><div class="stat-label">Días Trab.</div><div class="stat-value" id="days">0</div></div>
                <div class="stat-card"><div class="stat-label">Gastos</div><div class="stat-value warning" id="expensesTotal">$0</div></div>
            </div>
        </div>

        <!-- TRABAJOS -->
        <div id="works" class="content">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar por lugar..." onkeyup="filterWorks()">
            <div id="allWorksList"></div>
            
            <div class="backup-section">
                <h3 style="margin-bottom:10px; font-size:16px;">💾 Respaldo de Seguridad</h3>
                <button class="backup-btn btn-backup-save" onclick="exportBackup()">Descargar Copia</button>
                <label class="backup-btn btn-backup-load" style="display:inline-block; cursor:pointer;">
                    Restaurar Copia
                    <input type="file" id="restoreFile" onchange="importBackup(this)" style="display:none;" accept=".json">
                </label>
            </div>
        </div>

        <!-- GASTOS -->
        <div id="expenses" class="content">
            <h3 style="margin-bottom: 20px;">Historial de Gastos</h3>
            <div id="expensesList"></div>
        </div>

        <!-- GRÁFICOS -->
        <div id="stats" class="content">
            <div class="chart-box" style="background:white; padding:20px; border-radius:20px; margin-bottom:20px;"><h3>Ingresos vs Gastos</h3><canvas id="chart1"></canvas></div>
            <button onclick="exportCSV()" style="width:100%; padding:18px; background:white; border:2px solid var(--border); border-radius:16px; font-weight:700; cursor:pointer;">📥 Exportar Reporte CSV</button>
        </div>
    </div>

    <!-- MENÚ FLOTANTE -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('home', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Inicio</span>
        </div>
        <div class="nav-item" onclick="showTab('works', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
            <span>Trabajos</span>
        </div>
        
        <div class="fab-container">
            <div class="fab-btn" onclick="toggleFabMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="fab-menu" id="fabMenu">
                <div class="fab-option" onclick="openModal('work'); toggleFabMenu()">➕ Nuevo Trabajo</div>
                <div class="fab-option" onclick="openModal('expense'); toggleFabMenu()">💸 Nuevo Gasto</div>
            </div>
        </div>

        <div class="nav-item" onclick="showTab('expenses', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
            <span>Gastos</span>
        </div>
        <div class="nav-item" onclick="showTab('stats', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></div>
            <span>Stats</span>
        </div>
    </div>

    <!-- MODAL TRABAJO -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2 id="workModalTitle">Nuevo Trabajo</h2><div class="close-btn" onclick="closeModal('workModal')">&times;</div></div>
            <form onsubmit="saveWork(event)">
                <input type="hidden" id="wId">
                <div class="form-group"><label>Nombre del Trabajo / Lugar</label><input type="text" id="wLocation" required></div>
                <div class="form-group"><label>Monto Total ($)</label><input type="number" id="wAmount" step="0.01" required></div>
                
                <div class="form-group">
                    <label>Agregar Fecha Manual</label>
                    <div style="display:flex; gap:10px;">
                        <input type="date" id="wNewDate" style="flex:1;">
                        <button type="button" class="btn-action btn-primary-soft" onclick="addDateToTempList()" style="width:auto; padding:0 20px;">+</button>
                    </div>
                </div>
                
                <div id="tempDatesList" class="dates-list" style="margin-bottom:20px;"></div>

                <div class="form-group" style="background:var(--bg); padding:16px; border-radius:16px; display:flex; align-items:center; gap:12px;">
                    <input type="checkbox" id="wPaid" style="width:22px; height:22px;">
                    <label style="margin:0; font-size:15px;">¿Ya fue pagado?</label>
                </div>
                <button type="submit" class="btn-submit">Guardar Trabajo</button>
            </form>
        </div>
    </div>

    <!-- MODAL GASTO -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Nuevo Gasto</h2><div class="close-btn" onclick="closeModal('expenseModal')">&times;</div></div>
            <form onsubmit="saveExpense(event)">
                <div class="form-group"><label>Fecha</label><input type="date" id="eDate" required></div>
                <div class="form-group"><label>Descripción</label><input type="text" id="eDesc" required></div>
                <div class="form-group"><label>Monto ($)</label><input type="number" id="eAmount" step="0.01" required></div>
                <button type="submit" class="btn-submit">Guardar Gasto</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const DB = {
            get(key) { return JSON.parse(localStorage.getItem(key) || '[]'); },
            set(key, data) { localStorage.setItem(key, JSON.stringify(data)); },
            add(key, item) { item.id = Date.now(); const data = DB.get(key); data.push(item); DB.set(key, data); },
            update(key, id, newData) { const data = DB.get(key).map(i => i.id == id ? {...i, ...newData} : i); DB.set(key, data); },
            remove(key, id) { const data = DB.get(key).filter(i => i.id !== id); DB.set(key, data); }
        };

        let currentMonth = new Date();
        let chart1;
        let tempDates = [];
        let selectedRangeDates = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateHome();
            updateAllWorks();
            updateExpenses();
            document.getElementById('eDate').valueAsDate = new Date();
            document.getElementById('wNewDate').valueAsDate = new Date();
            document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
        });

        function showTab(name, element) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            if(element) element.classList.add('active');
            if (name === 'home') { renderCalendar(); updateHome(); }
            if (name === 'works') updateAllWorks();
            if (name === 'expenses') updateExpenses();
            if (name === 'stats') updateCharts();
        }

        function toggleFabMenu() {
            const menu = document.getElementById('fabMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // CALENDARIO
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            document.getElementById('monthYear').textContent = months[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const workDates = new Set();
            DB.get('works').forEach(w => w.dates.forEach(d => workDates.add(d)));

            let html = '';
            ['D','L','M','M','J','V','S'].forEach(d => html += `<div class="day-name">${d}</div>`);
            for (let i = 0; i < firstDay; i++) html += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasWork = workDates.has(dateStr);
                const isSelected = selectedRangeDates.includes(dateStr);
                
                let classes = 'day';
                if (hasWork) classes += ' has-work';
                if (isSelected) classes += ' selected-range';
                
                html += `<div class="${classes}" onclick="toggleDateSelection('${dateStr}')">${day}${hasWork && !isSelected ? '<div class="dot"></div>' : ''}</div>`;
            }
            document.getElementById('calGrid').innerHTML = html;
        }

        function toggleDateSelection(date) {
            if (selectedRangeDates.includes(date)) {
                selectedRangeDates = selectedRangeDates.filter(d => d !== date);
            } else {
                selectedRangeDates.push(date);
            }
            renderCalendar();
            document.getElementById('confirmRangeBtn').style.display = selectedRangeDates.length > 0 ? 'block' : 'none';
        }

        function confirmSelectedDates() {
            openModal('work');
            selectedRangeDates.forEach(d => {
                if(!tempDates.includes(d)) tempDates.push(d);
            });
            renderTempDates();
            selectedRangeDates = [];
            renderCalendar();
            document.getElementById('confirmRangeBtn').style.display = 'none';
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            selectedRangeDates = [];
            renderCalendar();
        }

        // HOME & PRÓXIMOS
        function updateHome() {
            const now = new Date();
            const works = DB.get('works');
            let earnings = 0, pending = 0, totalDays = new Set();
            
            // Lógica para "Esta Semana" (Próximos 7 días)
            const upcoming = [];
            const nextWeek = new Date();
            nextWeek.setDate(now.getDate() + 7);

            works.forEach(w => {
                w.dates.forEach(d => {
                    const dateObj = new Date(d);
                    if (dateObj >= now && dateObj <= nextWeek) {
                        upcoming.push({ date: d, location: w.location, paid: w.paid });
                    }
                });

                // Cálculos mensuales
                const datesInMonth = w.dates.filter(d => new Date(d).getMonth() === now.getMonth() && new Date(d).getFullYear() === now.getFullYear());
                if (datesInMonth.length > 0) {
                    const amountPerDay = parseFloat(w.amount) / w.dates.length;
                    const monthEarning = amountPerDay * datesInMonth.length;
                    earnings += monthEarning;
                    if (!w.paid) pending += monthEarning;
                    datesInMonth.forEach(d => totalDays.add(d));
                }
            });

            // Ordenar próximos por fecha
            upcoming.sort((a,b) => new Date(a.date) - new Date(b.date));
            
            const upcomingHtml = upcoming.length ? upcoming.map(u => `
                <div class="upcoming-card" style="border-left-color: ${u.paid ? 'var(--success)' : 'var(--danger)'}">
                    <div>
                        <div class="upcoming-date">${formatDate(u.date)}</div>
                        <div class="upcoming-place">${u.location}</div>
                    </div>
                    <div style="font-size:20px;">${u.paid ? '✅' : '⏳'}</div>
                </div>
            `).join('') : '<p style="color:var(--text-sec); text-align:center; padding:10px;">No hay trabajos programados esta semana</p>';
            
            document.getElementById('upcomingList').innerHTML = upcomingHtml;

            const expenses = DB.get('expenses').filter(e => new Date(e.date).getMonth() === now.getMonth()).reduce((s, e) => s + parseFloat(e.amount), 0);

            document.getElementById('earnings').textContent = '$' + earnings.toFixed(0);
            document.getElementById('days').textContent = totalDays.size;
            document.getElementById('pending').textContent = '$' + pending.toFixed(0);
            document.getElementById('expensesTotal').textContent = '$' + expenses.toFixed(0);
        }

        // LISTAS
        function updateAllWorks() {
            const allWorks = DB.get('works').sort((a,b) => new Date(b.dates[b.dates.length-1]) - new Date(a.dates[a.dates.length-1]));
            renderWorkList(allWorks);
        }

        function renderWorkList(works) {
            document.getElementById('allWorksList').innerHTML = works.length ? 
                works.map(w => createWorkHTML(w)).join('') : 
                '<div style="text-align:center;color:var(--text-sec);padding:40px;">Sin trabajos</div>';
        }

        function filterWorks() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const allWorks = DB.get('works');
            const filtered = allWorks.filter(w => w.location.toLowerCase().includes(term));
            renderWorkList(filtered);
        }

        function createWorkHTML(work) {
            const isPaid = work.paid;
            const statusClass = isPaid ? 'paid' : 'pending';
            const statusText = isPaid ? '✓ Pagado' : '⏳ Pendiente';
            
            const datesHtml = work.dates.sort().map(d => `
                <div class="date-chip">📅 ${formatDate(d)} <button onclick="removeDateFromWork(${work.id}, '${d}')">×</button></div>
            `).join('');

            return `
                <div class="work-card ${statusClass}">
                    <div class="card-header">
                        <div class="card-title">${work.location}</div>
                        <div class="card-amount">$${parseFloat(work.amount).toFixed(0)}</div>
                    </div>
                    <div class="dates-list">${datesHtml}</div>
                    <span class="status-badge ${statusClass}" onclick="quickToggleStatus(${work.id})">${statusText}</span>
                    <div class="card-actions">
                        <button class="btn-action btn-primary-soft" onclick="editWork(${work.id})">Editar / + Fecha</button>
                        <button class="btn-action btn-danger-soft" onclick="deleteItem('works', ${work.id})">Borrar</button>
                    </div>
                </div>
            `;
        }

        function quickToggleStatus(id) {
            const work = DB.get('works').find(w => w.id == id);
            if(work) { DB.update('works', id, { paid: !work.paid }); refreshAll(); }
        }

        // GESTIÓN DE FECHAS
        function addDateToTempList() {
            const date = document.getElementById('wNewDate').value;
            if (date && !tempDates.includes(date)) { tempDates.push(date); renderTempDates(); }
        }

        function renderTempDates() {
            document.getElementById('tempDatesList').innerHTML = tempDates.sort().map(d => `
                <div class="date-chip">📅 ${formatDate(d)} <button onclick="removeTempDate('${d}')">×</button></div>
            `).join('');
        }

        function removeTempDate(date) { tempDates = tempDates.filter(d => d !== date); renderTempDates(); }

        function removeDateFromWork(workId, dateToRemove) {
            if(confirm('¿Quitar esta fecha?')) {
                const works = DB.get('works');
                const work = works.find(w => w.id == workId);
                work.dates = work.dates.filter(d => d !== dateToRemove);
                if (work.dates.length === 0 && confirm('¿Eliminar trabajo sin fechas?')) DB.remove('works', workId);
                else DB.set('works', works);
                refreshAll();
            }
        }

        // MODALES
        function openModal(type) {
            tempDates = [];
            document.getElementById('tempDatesList').innerHTML = '';
            if (type === 'work') {
                document.getElementById('workModalTitle').textContent = 'Nuevo Trabajo';
                document.getElementById('wId').value = '';
                document.getElementById('wLocation').value = '';
                document.getElementById('wAmount').value = '';
                document.getElementById('wPaid').checked = false;
                document.getElementById('wNewDate').valueAsDate = new Date();
            } else {
                document.getElementById('eDate').valueAsDate = new Date();
                document.getElementById('eDesc').value = '';
                document.getElementById('eAmount').value = '';
            }
            document.getElementById(type + 'Modal').style.display = 'block';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function editWork(id) {
            const work = DB.get('works').find(w => w.id == id);
            if (!work) return;
            document.getElementById('workModalTitle').textContent = 'Editar Trabajo';
            document.getElementById('wId').value = work.id;
            document.getElementById('wLocation').value = work.location;
            document.getElementById('wAmount').value = work.amount;
            document.getElementById('wPaid').checked = work.paid;
            tempDates = [...work.dates];
            renderTempDates();
            document.getElementById('workModal').style.display = 'block';
        }

        function saveWork(e) {
            e.preventDefault();
            if (tempDates.length === 0) { alert('Agrega al menos una fecha'); return; }
            const id = document.getElementById('wId').value;
            const data = { location: document.getElementById('wLocation').value, amount: document.getElementById('wAmount').value, paid: document.getElementById('wPaid').checked, dates: tempDates.sort() };
            id ? DB.update('works', id, data) : DB.add('works', data);
            closeModal('workModal');
            refreshAll();
        }

        function saveExpense(e) {
            e.preventDefault();
            DB.add('expenses', { date: document.getElementById('eDate').value, description: document.getElementById('eDesc').value, amount: document.getElementById('eAmount').value });
            closeModal('expenseModal');
            refreshAll();
        }

        function deleteItem(type, id) { if (confirm('¿Eliminar?')) { DB.remove(type, id); refreshAll(); } }

        function refreshAll() { renderCalendar(); updateHome(); updateAllWorks(); updateExpenses(); }

        // RESPALDO
        function exportBackup() {
            const data = { works: DB.get('works'), expenses: DB.get('expenses'), date: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `backup_work_${new Date().toISOString().split('T')[0]}.json`; a.click();
        }

        function importBackup(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.works && data.expenses) {
                        if(confirm('Esto reemplazará tus datos actuales. ¿Continuar?')) {
                            DB.set('works', data.works); DB.set('expenses', data.expenses);
                            refreshAll(); alert('Datos restaurados');
                        }
                    }
                } catch (err) { alert('Error al leer archivo'); }
            };
            reader.readAsText(file);
        }

        function updateCharts() {
            const labels = [], income = [], expense = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                labels.push(['Ene','Feb','Mar','Abr','May','Jun'][i]);
                let mIncome = 0;
                DB.get('works').forEach(w => {
                    const daysInM = w.dates.filter(dt => new Date(dt).getMonth() === d.getMonth()).length;
                    if(daysInM > 0) mIncome += (parseFloat(w.amount) / w.dates.length) * daysInM;
                });
                income.push(mIncome);
                expense.push(DB.get('expenses').filter(e => new Date(e.date).getMonth() === d.getMonth()).reduce((s, e) => s + parseFloat(e.amount), 0));
            }
            if(chart1) chart1.destroy();
            chart1 = new Chart(document.getElementById('chart1'), { type: 'bar', data: { labels, datasets: [{ label: 'Ingresos', data: income, backgroundColor: '#4f46e5' }, { label: 'Gastos', data: expense, backgroundColor: '#f59e0b' }] } });
        }

        function exportCSV() {
            let csv = 'TIPO,FECHA,MONTO,DETALLE\n';
            DB.get('works').forEach(w => w.dates.forEach(d => csv += `Trabajo,${d},${(parseFloat(w.amount)/w.dates.length).toFixed(2)},${w.location}\n`));
            DB.get('expenses').forEach(e => csv += `Gasto,${e.date},${e.amount},${e.description}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reporte.csv'; a.click();
        }

        function formatDate(dateStr) { return new Date(dateStr + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
            if (!e.target.closest('.fab-container')) document.getElementById('fabMenu').style.display = 'none';
        }
    </script>
</body>
</html>
