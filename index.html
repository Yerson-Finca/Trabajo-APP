<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f1f5f9;
            --white: #ffffff;
            --text: #0f172a;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .container { max-width: 500px; margin: 0 auto; background: var(--white); min-height: 100vh; }
        
        header { background: var(--primary); color: white; padding: 20px; position: sticky; top: 0; z-index: 100; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 15px; }
        
        .tabs { display: flex; gap: 8px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: white; color: var(--primary); }
        
        .content { display: none; padding: 20px; }
        .content.active { display: block; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--bg); padding: 15px; border-radius: 12px; text-align: center; }
        .stat-label { font-size: 11px; color: var(--gray); text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stat-value.danger { color: var(--danger); }
        .stat-value.success { color: var(--success); }
        .stat-value.warning { color: var(--warning); }
        
        /* Botones */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: var(--bg); color: var(--text); }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        
        /* Items List */
        .item { background: var(--bg); padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
        .item.paid { border-left-color: var(--success); }
        .item.pending { border-left-color: var(--danger); }
        .item.expense { border-left-color: var(--warning); }
        
        .item-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .item-date { font-weight: 600; font-size: 14px; }
        .item-amount { font-weight: 700; font-size: 18px; color: var(--success); }
        .item-location { color: var(--gray); font-size: 13px; margin-bottom: 5px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-top: 5px; }
        .badge.paid { background: rgba(5, 150, 105, 0.1); color: var(--success); }
        .badge.pending { background: rgba(220, 38, 38, 0.1); color: var(--danger); }
        
        .delete { background: transparent; border: none; color: var(--danger); font-size: 12px; margin-top: 8px; cursor: pointer; }
        
        /* Calendario en Inicio */
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--bg); padding: 12px; border-radius: 10px; }
        .calendar-nav h2 { font-size: 18px; }
        .nav-arrow { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px 10px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 20px; }
        .day-name { text-align: center; font-size: 11px; color: var(--gray); padding: 8px 0; font-weight: 600; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--bg); border-radius: 8px; font-size: 14px; cursor: pointer; position: relative; }
        .day.has-work { background: rgba(5, 150, 105, 0.1); color: var(--success); font-weight: 600; }
        .day.selected { background: var(--primary); color: white; }
        .dot { position: absolute; bottom: 4px; width: 4px; height: 4px; background: var(--success); border-radius: 50%; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal-content { background: white; margin: 15% auto; padding: 25px; border-radius: 15px; width: 90%; max-width: 450px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close { font-size: 28px; cursor: pointer; color: var(--gray); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid var(--bg); border-radius: 8px; font-size: 15px; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        .checkbox-group { display: flex; align-items: center; gap: 10px; }
        .checkbox-group input { width: 20px; height: 20px; }
        
        .chart-box { background: var(--bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .chart-box h3 { text-align: center; margin-bottom: 15px; font-size: 16px; }
        
        @media (max-width: 480px) { .stats-grid, .actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌾 Work Tracker</h1>
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('home')">Inicio</button>
                <button class="tab-btn" onclick="showTab('works')">Trabajos</button>
                <button class="tab-btn" onclick="showTab('expenses')">Gastos</button>
                <button class="tab-btn" onclick="showTab('stats')">Gráficos</button>
            </div>
        </header>

        <!-- INICIO: Calendario + Resumen -->
        <div id="home" class="content active">
            <!-- Calendario Integrado -->
            <div class="calendar-nav">
                <button class="nav-arrow" onclick="changeMonth(-1)">◀</button>
                <h2 id="monthYear"></h2>
                <button class="nav-arrow" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="calendar-grid" id="calGrid"></div>
            
            <hr style="border:0; border-top:1px solid #e2e8f0; margin: 20px 0;">

            <!-- Resumen Financiero -->
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Ganancia Mes</div><div class="stat-value success" id="earnings">$0</div></div>
                <div class="stat-card"><div class="stat-label">Días Trabajados</div><div class="stat-value" id="days">0</div></div>
                <div class="stat-card"><div class="stat-label">Pendiente Pago</div><div class="stat-value danger" id="pending">$0</div></div>
                <div class="stat-card"><div class="stat-label">Gastos Mes</div><div class="stat-value warning" id="expensesTotal">$0</div></div>
            </div>
            
            <div class="actions">
                <button class="btn btn-primary" onclick="openModal('work')">+ Nuevo Trabajo</button>
                <button class="btn btn-secondary" onclick="openModal('expense')">+ Nuevo Gasto</button>
            </div>
        </div>

        <!-- TRABAJOS: Lista Completa -->
        <div id="works" class="content">
            <h3 style="margin-bottom: 15px;">Historial de Trabajos</h3>
            <div id="allWorksList"></div>
        </div>

        <!-- GASTOS -->
        <div id="expenses" class="content">
            <div class="stat-card" style="margin-bottom: 20px;">
                <div class="stat-label">Total Gastos Mes</div>
                <div class="stat-value warning" id="totalExpenses">$0</div>
            </div>
            <button class="btn btn-primary" onclick="openModal('expense')" style="margin-bottom: 20px;">+ Agregar Gasto</button>
            <div id="expensesList"></div>
        </div>

        <!-- GRÁFICOS -->
        <div id="stats" class="content">
            <div class="chart-box"><h3>Ingresos vs Gastos</h3><canvas id="chart1"></canvas></div>
            <div class="chart-box"><h3>Días Trabajados</h3><canvas id="chart2"></canvas></div>
            <button class="btn btn-secondary" onclick="exportCSV()">📥 Exportar CSV</button>
        </div>
    </div>

    <!-- MODAL TRABAJO -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2 id="workModalTitle">Nuevo Trabajo</h2><span class="close" onclick="closeModal('workModal')">&times;</span></div>
            <form onsubmit="saveWork(event)">
                <input type="hidden" id="wId">
                <div class="form-group"><label>Fecha</label><input type="date" id="wDate" required></div>
                <div class="form-group"><label>Lugar</label><input type="text" id="wLocation" placeholder="Ej: Finca El Roble" required></div>
                <div class="form-group"><label>Monto ($)</label><input type="number" id="wAmount" step="0.01" required></div>
                <div class="form-group checkbox-group"><input type="checkbox" id="wPaid"><label>¿Ya pagado?</label></div>
                <div class="form-group"><label>Notas</label><textarea id="wNotes" rows="2"></textarea></div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <!-- MODAL GASTO -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>Nuevo Gasto</h2><span class="close" onclick="closeModal('expenseModal')">&times;</span></div>
            <form onsubmit="saveExpense(event)">
                <div class="form-group"><label>Fecha</label><input type="date" id="eDate" required></div>
                <div class="form-group"><label>Descripción</label><input type="text" id="eDesc" placeholder="Ej: Combustible" required></div>
                <div class="form-group"><label>Monto ($)</label><input type="number" id="eAmount" step="0.01" required></div>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const DB = {
            get(key) { return JSON.parse(localStorage.getItem(key) || '[]'); },
            set(key, data) { localStorage.setItem(key, JSON.stringify(data)); },
            add(key, item) {
                const data = this.get(key);
                item.id = Date.now();
                data.push(item);
                this.set(key, data);
            },
            update(key, id, newData) {
                const data = this.get(key).map(i => i.id == id ? {...i, ...newData} : i);
                this.set(key, data);
            },
            remove(key, id) {
                const data = this.get(key).filter(i => i.id !== id);
                this.set(key, data);
            }
        };

        let currentMonth = new Date();
        let chart1, chart2;

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateHome();
            updateAllWorks();
            updateExpenses();
            document.getElementById('wDate').valueAsDate = new Date();
            document.getElementById('eDate').valueAsDate = new Date();
        });

        function showTab(name) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
            
            if (name === 'home') { renderCalendar(); updateHome(); }
            if (name === 'works') updateAllWorks();
            if (name === 'expenses') updateExpenses();
            if (name === 'stats') updateCharts();
        }

        // CALENDARIO (Integrado en Inicio)
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            
            document.getElementById('monthYear').textContent = months[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const workDates = new Set(DB.get('works').filter(w => {
                const d = new Date(w.date);
                return d.getMonth() === month && d.getFullYear() === year;
            }).map(w => w.date));

            let html = '';
            ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].forEach(d => {
                html += `<div class="day-name">${d}</div>`;
            });

            for (let i = 0; i < firstDay; i++) {
                html += '<div></div>';
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasWork = workDates.has(dateStr);
                
                html += `
                    <div class="day ${hasWork ? 'has-work' : ''}" onclick="goToWorksOnDate('${dateStr}')">
                        ${day}
                        ${hasWork ? '<div class="dot"></div>' : ''}
                    </div>
                `;
            }
            document.getElementById('calGrid').innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            renderCalendar();
        }

        function goToWorksOnDate(date) {
            // Al hacer clic en el calendario, lleva a la pestaña de trabajos filtrada (opcional)
            // Por ahora solo mostramos un alert o podríamos filtrar la lista
            showTab('works');
            // Aquí podrías implementar un filtro si quisieras
        }

        // HOME / RESUMEN
        function updateHome() {
            const now = new Date();
            const works = DB.get('works').filter(w => {
                const d = new Date(w.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            
            const earnings = works.reduce((s, w) => s + parseFloat(w.amount), 0);
            const pending = works.filter(w => !w.paid).reduce((s, w) => s + parseFloat(w.amount), 0);
            const days = new Set(works.map(w => w.date)).size;
            
            const expenses = DB.get('expenses').filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            }).reduce((s, e) => s + parseFloat(e.amount), 0);

            document.getElementById('earnings').textContent = '$' + earnings.toFixed(0);
            document.getElementById('days').textContent = days;
            document.getElementById('pending').textContent = '$' + pending.toFixed(0);
            document.getElementById('expensesTotal').textContent = '$' + expenses.toFixed(0);
        }

        // LISTA COMPLETA DE TRABAJOS
        function updateAllWorks() {
            const allWorks = DB.get('works').sort((a,b) => new Date(b.date) - new Date(a.date));
            const container = document.getElementById('allWorksList');
            
            if (allWorks.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">No hay trabajos registrados</p>';
                return;
            }
            
            container.innerHTML = allWorks.map(w => createItemHTML(w, 'work')).join('');
        }

        // ITEMS HTML
        function createItemHTML(item, type) {
            const isPaid = item.paid;
            const statusClass = type === 'work' ? (isPaid ? 'paid' : 'pending') : 'expense';
            const statusText = type === 'work' ? (isPaid ? '✓ Pagado' : '⏳ Pendiente') : '';
            
            let actionButtons = `<button class="delete" onclick="deleteItem('${type}', ${item.id})">Eliminar</button>`;
            
            if (type === 'work') {
                actionButtons = `
                    <div style="display:flex; gap:10px; margin-top:8px;">
                        <button class="btn btn-secondary" style="padding:8px; font-size:12px; margin:0;" onclick="editWork(${item.id})">Editar</button>
                        <button class="delete" onclick="deleteItem('${type}', ${item.id})">Eliminar</button>
                    </div>
                `;
            }
            
            return `
                <div class="item ${statusClass}">
                    <div class="item-header">
                        <span class="item-date">${formatDate(item.date)}</span>
                        <span class="item-amount">$${parseFloat(item.amount).toFixed(0)}</span>
                    </div>
                    <div class="item-location">${type === 'work' ? '📍 ' + item.location : item.description}</div>
                    ${type === 'work' && item.notes ? `<div style="font-size:12px;color:#999;margin-top:4px;">${item.notes}</div>` : ''}
                    ${statusText ? `<span class="badge ${isPaid ? 'paid' : 'pending'}">${statusText}</span>` : ''}
                    ${actionButtons}
                </div>
            `;
        }

        // GASTOS
        function updateExpenses() {
            const now = new Date();
            const expenses = DB.get('expenses').filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            
            const total = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
            document.getElementById('totalExpenses').textContent = '$' + total.toFixed(0);
            
            document.getElementById('expensesList').innerHTML = expenses.length ?
                expenses.slice().reverse().map(e => createItemHTML(e, 'expense')).join('') :
                '<p style="text-align:center;color:#999;padding:20px;">Sin gastos</p>';
        }

        // MODALES
        function openModal(type) {
            if (type === 'work') {
                document.getElementById('workModalTitle').textContent = 'Nuevo Trabajo';
                document.getElementById('wId').value = '';
                document.getElementById('wDate').valueAsDate = new Date();
                document.getElementById('wLocation').value = '';
                document.getElementById('wAmount').value = '';
                document.getElementById('wPaid').checked = false;
                document.getElementById('wNotes').value = '';
            } else {
                document.getElementById('eDate').valueAsDate = new Date();
                document.getElementById('eDesc').value = '';
                document.getElementById('eAmount').value = '';
            }
            document.getElementById(type + 'Modal').style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function editWork(id) {
            const work = DB.get('works').find(w => w.id == id);
            if (!work) return;
            
            document.getElementById('workModalTitle').textContent = 'Editar Trabajo';
            document.getElementById('wId').value = work.id;
            document.getElementById('wDate').value = work.date;
            document.getElementById('wLocation').value = work.location;
            document.getElementById('wAmount').value = work.amount;
            document.getElementById('wPaid').checked = work.paid;
            document.getElementById('wNotes').value = work.notes || '';
            
            document.getElementById('workModal').style.display = 'block';
        }

        function saveWork(e) {
            e.preventDefault();
            const id = document.getElementById('wId').value;
            const workData = {
                date: document.getElementById('wDate').value,
                location: document.getElementById('wLocation').value,
                amount: document.getElementById('wAmount').value,
                paid: document.getElementById('wPaid').checked,
                notes: document.getElementById('wNotes').value
            };
            
            if (id) {
                DB.update('works', id, workData);
            } else {
                DB.add('works', workData);
            }
            
            closeModal('workModal');
            updateHome();
            renderCalendar();
            updateAllWorks();
        }

        function saveExpense(e) {
            e.preventDefault();
            DB.add('expenses', {
                date: document.getElementById('eDate').value,
                description: document.getElementById('eDesc').value,
                amount: document.getElementById('eAmount').value
            });
            closeModal('expenseModal');
            updateExpenses();
            updateHome();
        }

        function deleteItem(type, id) {
            if (confirm('¿Eliminar este registro?')) {
                DB.remove(type === 'work' ? 'works' : 'expenses', id);
                updateHome();
                renderCalendar();
                updateAllWorks();
                updateExpenses();
            }
        }

        // GRÁFICOS
        function updateCharts() {
            const labels = [];
            const income = [];
            const expense = [];
            const days = [];
            
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                labels.push(['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]);
                
                const monthWorks = DB.get('works').filter(w => {
                    const wd = new Date(w.date);
                    return wd.getMonth() === d.getMonth() && wd.getFullYear() === d.getFullYear();
                });
                
                income.push(monthWorks.reduce((s, w) => s + parseFloat(w.amount), 0));
                expense.push(DB.get('expenses').filter(e => {
                    const ed = new Date(e.date);
                    return ed.getMonth() === d.getMonth() && ed.getFullYear() === d.getFullYear();
                }).reduce((s, e) => s + parseFloat(e.amount), 0));
                days.push(new Set(monthWorks.map(w => w.date)).size);
            }

            if (chart1) chart1.destroy();
            chart1 = new Chart(document.getElementById('chart1'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ingresos', data: income, backgroundColor: '#2563eb' },
                        { label: 'Gastos', data: expense, backgroundColor: '#d97706' }
                    ]
                },
                options: { responsive: true }
            });

            if (chart2) chart2.destroy();
            chart2 = new Chart(document.getElementById('chart2'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Días',
                        data: days,
                        borderColor: '#059669',
                        tension: 0.4,
                        fill: true,
                        backgroundColor: 'rgba(5, 150, 105, 0.1)'
                    }]
                },
                options: { responsive: true }
            });
        }

        // EXPORTAR
        function exportCSV() {
            let csv = 'TIPO,FECHA,MONTO,DETALLE,ESTADO\n';
            DB.get('works').forEach(w => {
                csv += `Trabajo,${w.date},${w.amount},${w.location},${w.paid ? 'Pagado' : 'Pendiente'}\n`;
            });
            DB.get('expenses').forEach(e => {
                csv += `Gasto,${e.date},${e.amount},${e.description},-\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'datos.csv';
            a.click();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) {
                e.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
