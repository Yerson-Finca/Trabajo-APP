<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Tracker Pro</title>
    <style>
        :root {
            --primary: #4f46e5; /* Indigo Moderno */
            --primary-light: #818cf8;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-sec: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            color: var(--text-main); 
            padding-bottom: 110px;
            line-height: 1.5;
        }

        .container { max-width: 600px; margin: 0 auto; min-height: 100vh; position: relative; }
        
        /* Header Minimalista */
        header { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 24px; 
            position: sticky; 
            top: 0; 
            z-index: 90; 
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .date-display { font-size: 12px; color: var(--text-sec); font-weight: 600; background: var(--bg); padding: 6px 12px; border-radius: 20px; }
        
        /* Contenido */
        .content { display: none; padding: 24px; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Bento Grid Stats */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
            margin-bottom: 30px; 
        }
        
        .stat-card { 
            background: var(--surface); 
            padding: 20px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 110px;
            transition: transform 0.2s;
        }
        
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .stat-icon { 
            width: 36px; height: 36px; 
            border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px;
        }
        
        .stat-icon.blue { background: #eff6ff; color: var(--primary); }
        .stat-icon.green { background: #ecfdf5; color: var(--success); }
        .stat-icon.red { background: #fff1f2; color: var(--danger); }
        .stat-icon.orange { background: #fffbeb; color: var(--warning); }
        
        .stat-label { font-size: 12px; color: var(--text-sec); font-weight: 600; margin-bottom: 4px; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        
        /* Calendario Moderno */
        .calendar-wrapper {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }
        
        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-nav h2 { font-size: 18px; font-weight: 700; }
        .nav-btn { background: var(--bg); border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .nav-btn:hover { background: var(--border); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-name { text-align: center; font-size: 11px; color: var(--text-sec); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
        
        .day { 
            aspect-ratio: 1; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 12px; 
            font-size: 14px; font-weight: 600; 
            cursor: pointer; 
            position: relative; 
            transition: all 0.2s;
            color: var(--text-main);
        }
        
        .day:hover { background: var(--bg); }
        .day.has-work { background: var(--primary); color: white; font-weight: 700; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .day.today { border: 2px solid var(--primary); color: var(--primary); }
        .day.has-work.today { color: white; border-color: rgba(255,255,255,0.3); }
        
        .dot { position: absolute; bottom: 6px; width: 4px; height: 4px; background: currentColor; border-radius: 50%; opacity: 0.7; }
        
        /* Lista de Trabajos (Cards) */
        .section-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .work-card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 20px; 
            margin-bottom: 16px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        
        .work-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
            background: var(--primary);
        }
        .work-card.paid::before { background: var(--success); }
        .work-card.pending::before { background: var(--danger); }
        
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .card-title { font-weight: 700; font-size: 16px; color: var(--text-main); line-height: 1.3; }
        .card-amount { font-weight: 800; font-size: 18px; color: var(--success); background: #ecfdf5; padding: 4px 10px; border-radius: 8px; }
        
        .dates-list { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
        .date-chip { 
            background: var(--bg); 
            padding: 6px 10px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-sec);
            display: flex; align-items: center; gap: 6px;
            border: 1px solid transparent;
        }
        .date-chip button { background: none; border: none; color: var(--danger); cursor: pointer; padding: 0; font-size: 14px; line-height: 1; }
        
        .status-badge { 
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 20px; 
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-badge.paid { background: #ecfdf5; color: var(--success); }
        .status-badge.pending { background: #fff1f2; color: var(--danger); }
        
        .card-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
        .btn-action { 
            flex: 1; padding: 10px; border-radius: 10px; border: none; 
            font-size: 13px; font-weight: 600; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.2s;
        }
        .btn-primary-soft { background: #eff6ff; color: var(--primary); }
        .btn-primary-soft:hover { background: #dbeafe; }
        .btn-danger-soft { background: #fff1f2; color: var(--danger); }
        .btn-danger-soft:hover { background: #ffe4e6; }
        
        /* Menú Flotante Glassmorphism */
        .bottom-nav {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; height: 72px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 36px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            z-index: 1000; padding: 0 12px;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-sec); font-size: 10px; font-weight: 600;
            cursor: pointer; width: 56px; height: 100%;
            transition: all 0.3s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-icon svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; margin-bottom: 4px; transition: transform 0.3s; }
        .nav-item.active .nav-icon svg { transform: translateY(-2px); stroke-width: 2.5; }

        .fab-container { position: relative; top: -28px; display: flex; justify-content: center; width: 64px; }
        .fab-btn {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
            cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid var(--bg);
        }
        .fab-btn:active { transform: scale(0.9); }
        .fab-btn svg { width: 28px; height: 28px; stroke: white; stroke-width: 2.5; fill: none; }

        .fab-menu {
            position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
            display: none; flex-direction: column; gap: 10px; width: 200px; z-index: 999;
        }
        .fab-option {
            background: white; padding: 14px; border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            font-weight: 700; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; color: var(--text-main);
            animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes popIn { from { transform: scale(0.8) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

        /* Modal Moderno */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 2000; backdrop-filter: blur(8px); }
        .modal-content { 
            background: var(--surface); 
            margin: 10% auto; padding: 32px; 
            border-radius: 32px; 
            width: 90%; max-width: 480px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .modal-title { font-size: 24px; font-weight: 800; color: var(--text-main); }
        .close-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); border: none; font-size: 20px; cursor: pointer; color: var(--text-sec); display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-btn:hover { background: #fee2e2; color: var(--danger); }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-main); }
        .form-input { 
            width: 100%; padding: 16px; 
            border: 2px solid var(--border); 
            border-radius: 16px; 
            font-size: 16px; background: var(--bg); 
            transition: all 0.3s; font-weight: 500; color: var(--text-main);
        }
        .form-input:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .checkbox-wrapper { 
            background: var(--bg); padding: 16px; border-radius: 16px; 
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .checkbox-wrapper.checked { background: #eff6ff; border-color: var(--primary); }
        .checkbox-wrapper input { width: 20px; height: 20px; accent-color: var(--primary); }
        
        .btn-submit { 
            width: 100%; padding: 18px; 
            background: var(--primary); color: white; 
            border: none; border-radius: 16px; 
            font-size: 16px; font-weight: 700; 
            cursor: pointer; margin-top: 12px; 
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.2);
            transition: transform 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }

        .chart-box { background: white; padding: 24px; border-radius: 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        .chart-box h3 { text-align: center; margin-bottom: 20px; font-size: 16px; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Work Tracker</h1>
            <div class="date-display" id="currentDateDisplay"></div>
        </header>

        <!-- INICIO -->
        <div id="home" class="content active">
            <div class="calendar-wrapper">
                <div class="calendar-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <h2 id="monthYear"></h2>
                    <button class="nav-btn" onclick="changeMonth(1)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>
                </div>
                <div class="calendar-grid" id="calGrid"></div>
            </div>
            
            <div class="section-title">Resumen Mensual</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                    <div><div class="stat-label">Ganancia</div><div class="stat-value success" id="earnings">$0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                    <div><div class="stat-label">Pendiente</div><div class="stat-value danger" id="pending">$0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                    <div><div class="stat-label">Días Trab.</div><div class="stat-value" id="days">0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></div>
                    <div><div class="stat-label">Gastos</div><div class="stat-value warning" id="expensesTotal">$0</div></div>
                </div>
            </div>
        </div>

        <!-- TRABAJOS -->
        <div id="works" class="content">
            <div class="section-title">Mis Trabajos Activos</div>
            <div id="allWorksList"></div>
        </div>

        <!-- GASTOS -->
        <div id="expenses" class="content">
            <div class="section-title">Historial de Gastos</div>
            <div id="expensesList"></div>
        </div>

        <!-- GRÁFICOS -->
        <div id="stats" class="content">
            <div class="chart-box"><h3>Ingresos vs Gastos</h3><canvas id="chart1"></canvas></div>
            <div class="chart-box"><h3>Días Trabajados</h3><canvas id="chart2"></canvas></div>
            <button onclick="exportCSV()" style="width:100%; padding:18px; background:white; border:2px solid var(--border); border-radius:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--text-main);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Exportar Reporte CSV
            </button>
        </div>
    </div>

    <!-- MENÚ FLOTANTE -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('home', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Inicio</span>
        </div>
        <div class="nav-item" onclick="showTab('works', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
            <span>Trabajos</span>
        </div>
        
        <div class="fab-container">
            <div class="fab-btn" onclick="toggleFabMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <div class="fab-menu" id="fabMenu">
                <div class="fab-option" onclick="openModal('work'); toggleFabMenu()">
                    <div style="background:#eff6ff; padding:8px; border-radius:10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg></div>
                    Nuevo Trabajo
                </div>
                <div class="fab-option" onclick="openModal('expense'); toggleFabMenu()">
                    <div style="background:#fffbeb; padding:8px; border-radius:10px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
                    Nuevo Gasto
                </div>
            </div>
        </div>

        <div class="nav-item" onclick="showTab('expenses', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div>
            <span>Gastos</span>
        </div>
        <div class="nav-item" onclick="showTab('stats', this)">
            <div class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></div>
            <span>Stats</span>
        </div>
    </div>

    <!-- MODAL TRABAJO -->
    <div id="workModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title" id="workModalTitle">Nuevo Trabajo</h2><button class="close-btn" onclick="closeModal('workModal')">&times;</button></div>
            <form onsubmit="saveWork(event)">
                <input type="hidden" id="wId">
                <div class="form-group">
                    <label class="form-label">Nombre del Trabajo / Lugar</label>
                    <input type="text" id="wLocation" class="form-input" placeholder="Ej: Cosecha Finca El Roble" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Monto Total ($)</label>
                    <input type="number" id="wAmount" class="form-input" step="0.01" placeholder="0.00" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Agregar Fecha</label>
                    <div style="display:flex; gap:10px;">
                        <input type="date" id="wNewDate" class="form-input" style="flex:1;">
                        <button type="button" class="btn-action btn-primary-soft" onclick="addDateToTempList()" style="width:auto; padding:0 20px; font-size:20px;">+</button>
                    </div>
                </div>
                
                <div id="tempDatesList" class="dates-list" style="margin-bottom:20px;"></div>

                <div class="form-group">
                    <label class="checkbox-wrapper" id="paidWrapper" onclick="togglePaidCheck()">
                        <input type="checkbox" id="wPaid">
                        <span style="font-weight:600; color:var(--text-main);">¿El trabajo ya fue pagado?</span>
                    </label>
                </div>
                <button type="submit" class="btn-submit">Guardar Trabajo</button>
            </form>
        </div>
    </div>

    <!-- MODAL GASTO -->
    <div id="expenseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2 class="modal-title">Nuevo Gasto</h2><button class="close-btn" onclick="closeModal('expenseModal')">&times;</button></div>
            <form onsubmit="saveExpense(event)">
                <div class="form-group"><label class="form-label">Fecha</label><input type="date" id="eDate" class="form-input" required></div>
                <div class="form-group"><label class="form-label">Descripción</label><input type="text" id="eDesc" class="form-input" placeholder="Ej: Combustible, Almuerzo" required></div>
                <div class="form-group"><label class="form-label">Monto ($)</label><input type="number" id="eAmount" class="form-input" step="0.01" required></div>
                <button type="submit" class="btn-submit">Guardar Gasto</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const DB = {
            get(key) { return JSON.parse(localStorage.getItem(key) || '[]'); },
            set(key, data) { localStorage.setItem(key, JSON.stringify(data)); },
            add(key, item) {
                const data = this.get(key);
                item.id = Date.now();
                data.push(item);
                this.set(key, data);
            },
            update(key, id, newData) {
                const data = this.get(key).map(i => i.id == id ? {...i, ...newData} : i);
                this.set(key, data);
            },
            remove(key, id) {
                const data = this.get(key).filter(i => i.id !== id);
                this.set(key, data);
            }
        };

        let currentMonth = new Date();
        let chart1, chart2;
        let tempDates = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            updateHome();
            updateAllWorks();
            updateExpenses();
            document.getElementById('eDate').valueAsDate = new Date();
            document.getElementById('wNewDate').valueAsDate = new Date();
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').textContent = new Date().toLocaleDateString('es-ES', options);
        });

        function showTab(name, element) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            if(element) element.classList.add('active');
            
            if (name === 'home') { renderCalendar(); updateHome(); }
            if (name === 'works') updateAllWorks();
            if (name === 'expenses') updateExpenses();
            if (name === 'stats') updateCharts();
        }

        function toggleFabMenu() {
            const menu = document.getElementById('fabMenu');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        // CALENDARIO
        function renderCalendar() {
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            
            document.getElementById('monthYear').textContent = months[month] + ' ' + year;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            const allWorks = DB.get('works');
            const workDates = new Set();
            allWorks.forEach(w => {
                if(w.dates) w.dates.forEach(d => workDates.add(d));
            });

            let html = '';
            ['D','L','M','M','J','V','S'].forEach(d => html += `<div class="day-name">${d}</div>`);

            for (let i = 0; i < firstDay; i++) html += '<div></div>';

            const today = new Date();
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                const hasWork = workDates.has(dateStr);
                const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
                
                let classes = 'day';
                if (hasWork) classes += ' has-work';
                if (isToday) classes += ' today';
                
                html += `<div class="${classes}">${day}${hasWork ? '<div class="dot"></div>' : ''}</div>`;
            }
            document.getElementById('calGrid').innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            renderCalendar();
        }

        // HOME
        function updateHome() {
            const now = new Date();
            const works = DB.get('works');
            
            let earnings = 0;
            let pending = 0;
            let totalDays = new Set();
            
            works.forEach(w => {
                const datesInMonth = w.dates.filter(d => {
                    const dt = new Date(d);
                    return dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear();
                });
                
                if (datesInMonth.length > 0) {
                    const amountPerDay = parseFloat(w.amount) / w.dates.length;
                    const monthEarning = amountPerDay * datesInMonth.length;
                    
                    earnings += monthEarning;
                    if (!w.paid) pending += monthEarning;
                    
                    datesInMonth.forEach(d => totalDays.add(d));
                }
            });

            const expenses = DB.get('expenses').filter(e => new Date(e.date).getMonth() === now.getMonth()).reduce((s, e) => s + parseFloat(e.amount), 0);

            document.getElementById('earnings').textContent = '$' + earnings.toFixed(0);
            document.getElementById('days').textContent = totalDays.size;
            document.getElementById('pending').textContent = '$' + pending.toFixed(0);
            document.getElementById('expensesTotal').textContent = '$' + expenses.toFixed(0);
        }

        // LISTAS
        function updateAllWorks() {
            const allWorks = DB.get('works').sort((a,b) => new Date(b.dates[b.dates.length-1]) - new Date(a.dates[a.dates.length-1]));
            document.getElementById('allWorksList').innerHTML = allWorks.length ? 
                allWorks.map(w => createWorkHTML(w)).join('') : 
                '<div style="text-align:center;color:var(--text-sec);padding:40px;">No hay trabajos registrados aún</div>';
        }

        function updateExpenses() {
            const expenses = DB.get('expenses').sort((a,b) => new Date(b.date) - new Date(a.date));
            document.getElementById('expensesList').innerHTML = expenses.length ? 
                expenses.map(e => createItemHTML(e)).join('') : 
                '<div style="text-align:center;color:var(--text-sec);padding:40px;">Sin gastos registrados</div>';
        }

        function createWorkHTML(work) {
            const isPaid = work.paid;
            const statusClass = isPaid ? 'paid' : 'pending';
            const statusText = isPaid ? '✓ Pagado' : '⏳ Pendiente';
            
            const datesHtml = work.dates.sort().map(d => `
                <div class="date-chip">
                    📅 ${formatDate(d)}
                    <button onclick="removeDateFromWork(${work.id}, '${d}')">×</button>
                </div>
            `).join('');

            return `
                <div class="work-card ${statusClass}">
                    <div class="card-header">
                        <div class="card-title">${work.location}</div>
                        <div class="card-amount">$${parseFloat(work.amount).toFixed(0)}</div>
                    </div>
                    <div class="dates-list">${datesHtml}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn-action btn-primary-soft" onclick="quickAddDate(${work.id})">+ Fecha</button>
                        <button class="btn-action btn-primary-soft" onclick="editWork(${work.id})">Editar</button>
                        <button class="btn-action btn-danger-soft" onclick="deleteItem('works', ${work.id})">Borrar</button>
                    </div>
                </div>
            `;
        }

        function createItemHTML(item) {
            return `
                <div class="work-card" style="border-left-color:var(--warning)">
                    <div class="card-header">
                        <div class="card-title">${item.description}</div>
                        <div class="card-amount" style="color:var(--danger); background:#fff1f2">$${parseFloat(item.amount).toFixed(0)}</div>
                    </div>
                    <div style="color:var(--text-sec); font-size:13px; margin-bottom:10px;">📅 ${formatDate(item.date)}</div>
                    <div class="card-actions"><button class="btn-action btn-danger-soft" style="width:100%" onclick="deleteItem('expenses', ${item.id})">Eliminar Gasto</button></div>
                </div>
            `;
        }

        // GESTIÓN DE FECHAS
        function addDateToTempList() {
            const dateInput = document.getElementById('wNewDate');
            const date = dateInput.value;
            if (date && !tempDates.includes(date)) {
                tempDates.push(date);
                renderTempDates();
                dateInput.value = '';
            }
        }

        function renderTempDates() {
            const container = document.getElementById('tempDatesList');
            container.innerHTML = tempDates.sort().map(d => `
                <div class="date-chip">
                    📅 ${formatDate(d)}
                    <button onclick="removeTempDate('${d}')">×</button>
                </div>
            `).join('');
        }

        function removeTempDate(date) {
            tempDates = tempDates.filter(d => d !== date);
            renderTempDates();
        }

        function removeDateFromWork(workId, dateToRemove) {
            if(confirm('¿Quitar esta fecha del trabajo?')) {
                const works = DB.get('works');
                const workIndex = works.findIndex(w => w.id == workId);
                if (workIndex !== -1) {
                    works[workIndex].dates = works[workIndex].dates.filter(d => d !== dateToRemove);
                    if (works[workIndex].dates.length === 0) {
                        if(confirm('El trabajo ya no tiene fechas. ¿Deseas eliminarlo?')) {
                            DB.remove('works', workId);
                        } else {
                            DB.set('works', works);
                        }
                    } else {
                        DB.set('works', works);
                    }
                    refreshAll();
                }
            }
        }

        function quickAddDate(workId) {
            editWork(workId, true);
        }

        // MODALES
        function openModal(type) {
            tempDates = [];
            document.getElementById('tempDatesList').innerHTML = '';
            
            if (type === 'work') {
                document.getElementById('workModalTitle').textContent = 'Nuevo Trabajo';
                document.getElementById('wId').value = '';
                document.getElementById('wLocation').value = '';
                document.getElementById('wAmount').value = '';
                document.getElementById('wPaid').checked = false;
                document.getElementById('paidWrapper').classList.remove('checked');
                document.getElementById('wNewDate').valueAsDate = new Date();
            } else {
                document.getElementById('eDate').valueAsDate = new Date();
                document.getElementById('eDesc').value = '';
                document.getElementById('eAmount').value = '';
            }
            document.getElementById(type + 'Modal').style.display = 'block';
        }

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function togglePaidCheck() {
            const cb = document.getElementById('wPaid');
            cb.checked = !cb.checked;
            const wrapper = document.getElementById('paidWrapper');
            if(cb.checked) wrapper.classList.add('checked');
            else wrapper.classList.remove('checked');
        }

        function editWork(id, isQuickAdd = false) {
            const work = DB.get('works').find(w => w.id == id);
            if (!work) return;
            
            document.getElementById('workModalTitle').textContent = isQuickAdd ? 'Agregar Fecha' : 'Editar Trabajo';
            document.getElementById('wId').value = work.id;
            document.getElementById('wLocation').value = work.location;
            document.getElementById('wAmount').value = work.amount;
            document.getElementById('wPaid').checked = work.paid;
            
            const wrapper = document.getElementById('paidWrapper');
            if(work.paid) wrapper.classList.add('checked');
            else wrapper.classList.remove('checked');
            
            tempDates = [...work.dates];
            renderTempDates();
            
            document.getElementById('wNewDate').valueAsDate = new Date();
            document.getElementById('workModal').style.display = 'block';
        }

        function saveWork(e) {
            e.preventDefault();
            const id = document.getElementById('wId').value;
            
            if (tempDates.length === 0) {
                alert('Debes agregar al menos una fecha');
                return;
            }

            const data = {
                location: document.getElementById('wLocation').value,
                amount: document.getElementById('wAmount').value,
                paid: document.getElementById('wPaid').checked,
                dates: tempDates.sort()
            };
            
            if (id) {
                DB.update('works', id, data);
            } else {
                DB.add('works', data);
            }
            
            closeModal('workModal');
            refreshAll();
        }

        function saveExpense(e) {
            e.preventDefault();
            DB.add('expenses', {
                date: document.getElementById('eDate').value,
                description: document.getElementById('eDesc').value,
                amount: document.getElementById('eAmount').value
            });
            closeModal('expenseModal');
            refreshAll();
        }

        function deleteItem(type, id) {
            if (confirm('¿Estás seguro de eliminar?')) {
                DB.remove(type, id);
                refreshAll();
            }
        }

        function refreshAll() {
            renderCalendar();
            updateHome();
            updateAllWorks();
            updateExpenses();
        }

        // GRÁFICOS & EXPORT
        function updateCharts() {
            const labels = [], income = [], expense = [], days = [];
            const now = new Date();
            for (let i = 5; i >= 0; i--) {
                const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                labels.push(['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]);
                
                let monthIncome = 0;
                let monthDaysSet = new Set();
                
                DB.get('works').forEach(w => {
                    const datesInMonth = w.dates.filter(dt => {
                        const dateObj = new Date(dt);
                        return dateObj.getMonth() === d.getMonth() && dateObj.getFullYear() === d.getFullYear();
                    });
                    
                    if (datesInMonth.length > 0) {
                        const amountPerDay = parseFloat(w.amount) / w.dates.length;
                        monthIncome += (amountPerDay * datesInMonth.length);
                        datesInMonth.forEach(dt => monthDaysSet.add(dt));
                    }
                });
                
                income.push(monthIncome);
                days.push(monthDaysSet.size);
                
                expense.push(DB.get('expenses').filter(e => new Date(e.date).getMonth() === d.getMonth()).reduce((s, e) => s + parseFloat(e.amount), 0));
            }

            if(chart1) chart1.destroy();
            chart1 = new Chart(document.getElementById('chart1'), { type: 'bar', data: { labels, datasets: [{ label: 'Ingresos', data: income, backgroundColor: '#4f46e5', borderRadius: 8 }, { label: 'Gastos', data: expense, backgroundColor: '#f59e0b', borderRadius: 8 }] }, options: { responsive: true, plugins: { legend: { display: false } } } });

            if(chart2) chart2.destroy();
            chart2 = new Chart(document.getElementById('chart2'), { type: 'line', data: { labels, datasets: [{ label: 'Días', data: days, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', tension: 0.4, fill: true, pointRadius: 4, pointBackgroundColor: '#fff', pointBorderWidth: 2 }] }, options: { responsive: true, plugins: { legend: { display: false } } } });
        }

        function exportCSV() {
            let csv = 'TIPO,FECHA,MONTO,DETALLE,ESTADO\n';
            DB.get('works').forEach(w => {
                w.dates.forEach(d => {
                    csv += `Trabajo,${d},${(parseFloat(w.amount)/w.dates.length).toFixed(2)},${w.location},${w.paid?'Pagado':'Pendiente'}\n`;
                });
            });
            DB.get('expenses').forEach(e => {
                csv += `Gasto,${e.date},${e.amount},${e.description},-\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reporte.csv'; a.click();
        }

        function formatDate(dateStr) {
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
        }

        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) e.target.style.display = 'none';
            if (!e.target.closest('.fab-container')) document.getElementById('fabMenu').style.display = 'none';
        }
    </script>
</body>
</html>
